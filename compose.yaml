name: hey-doc

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hey_doc
      POSTGRES_USER: hey_doc
      POSTGRES_PASSWORD: ${HEYDOC_DB_PASSWORD:-hey_doc_local}
    ports:
      - "127.0.0.1:${HEYDOC_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hey_doc -d hey_doc"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
