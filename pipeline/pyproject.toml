[project]
name = "heydoc-pipeline"
version = "0.1.0"
description = "Collecte, normalisation et chargement des données Hey-Doc"
readme = "README.md"
authors = [
    { name = "is2ac", email = "isaac.yao@kaydantechnology.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.11",
    "psycopg[binary]>=3.3.9",
]

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.32.0",
    "rapidocr>=3.10.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
